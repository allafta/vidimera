packages:
  - packages/*
# The embedded-Postgres platform binaries (the adapter suite's test server, pinned in
# packages/store-postgres) are the only dependencies allowed to run install scripts —
# one entry per platform the CI matrix and this repository's machines cover.
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
