# Weekly, grouped dependency updates (phase-3 ruling). One PR per ecosystem per week at
# most — CI's full gate set, the packed-tarball smoke test included, is what makes these
# safe to review quickly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release (the release-hardening increment): a
    # compromised or yanked version usually surfaces within days of publication.
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # The @types/node major is pinned to the engines floor's major line (the
      # registry-hygiene increment's ruling 2): a types major above the floor would let
      # post-floor APIs typecheck. Minors/patches still flow weekly.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release (the release-hardening increment): a
    # compromised or yanked version usually surfaces within days of publication.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
