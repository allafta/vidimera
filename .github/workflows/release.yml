# The 0.1-cut release workflow (phase-2 packaging ruling: manual version, dispatch
# publish; phase-5 ruling: BOTH packages publish at the cut). Deliberately manual-only:
# publishing is the release event the phase-0 record gates on readiness, never on a push.
# Release day, in order (docs/process/release-checklist.md is the authoritative list):
# bump both versions off 0.0.0, drop both `private: true`, commit, tag v<version>, then
# dispatch this workflow — the guard step refuses to publish a package that skipped any
# of that. Publishing goes tarball-first (`pnpm pack`, then `npm publish <tarball>`) so
# pnpm rewrites the adapter's `workspace:*` peer range to the real version. Requires the
# NPM_TOKEN repository secret (an npm automation token for the @vidimera scope).
# `dry_run: true` runs the same job with the guard reporting but not blocking, both publish
# steps skipped, and the publish steps' own pack commands in their place: it proves the job's structure and every
# gate on the release runner — never the publish, the provenance attestation, or the token
# — and it does not retire deferral-register row 1, whose trigger is the real publish.
name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack both tarballs; skip the guard and both publish steps'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write # npm provenance attestation
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: dry run — the pre-release guard reports without blocking; both publish steps are skipped
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry run: the guard below reports without blocking; nothing will be published"
      # The release-day guard: refuse any package still carrying the pre-release shape. In a
      # dry run it still runs and still reports, but the job continues past its refusal.
      - name: guard — versions bumped and private dropped, both packages
        continue-on-error: ${{ inputs.dry_run }}
        run: |
          node -e "
            for (const pkg of ['record', 'store-postgres']) {
              const p = require('./packages/' + pkg + '/package.json');
              if (p.private) { console.error('refusing to publish ' + p.name + ': private is still true'); process.exit(1); }
              if (p.version === '0.0.0') { console.error('refusing to publish ' + p.name + ': version is still 0.0.0'); process.exit(1); }
            }
          "
      # Every gate the repository has, then the artifact gates.
      - run: pnpm typecheck
      # The test gate reads vitest's own JSON report rather than trusting the step's exit code —
      # a code that has to survive vitest, pnpm and the runner's shell in turn, and was silently 0
      # for every failed run until the CI test-gate repair (scripts/ci-assert-tests.mjs).
      - run: pnpm test:ci
      - run: node scripts/ci-assert-tests.mjs .vitest-results.json
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm lint:strict
      - run: pnpm contract-scan
      - run: pnpm api-sync
      - run: pnpm docs-index-sync
      # Dry run: the publish steps' own pack commands, in their own directories, and nothing
      # else — the tarballs are built and left on the runner.
      - name: pack both tarballs (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          (cd packages/record && pnpm pack)
          (cd packages/store-postgres && pnpm pack)
      # Tarball-first so pnpm rewrites workspace: ranges; record publishes before the
      # adapter that peer-depends on it.
      - name: publish @vidimera/record (provenance, public)
        if: ${{ !inputs.dry_run }}
        run: |
          pnpm pack
          npm publish ./*.tgz --provenance --access public
        working-directory: packages/record
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish @vidimera/store-postgres (provenance, public)
        if: ${{ !inputs.dry_run }}
        run: |
          pnpm pack
          npm publish ./*.tgz --provenance --access public
        working-directory: packages/store-postgres
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
