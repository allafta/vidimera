# Two-tier CI (phase-3 ruling, docs/analysis/2026-08-19-phase-3-ci.md): the
# platform-independent gates run once on Linux; tests + build + the packed-tarball smoke
# test run on a small deliberate matrix — the exact declared engines floor (22.16.0, which
# a bare `node-version: 22` never tests), current Node, and all three OSes (this repository
# is developed on Windows, and node:sqlite plus npm pack are the platform-sensitive parts).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm contract-scan
      - run: pnpm api-sync
      - run: pnpm docs-index-sync
      - run: pnpm lint:strict
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.16.0 # the declared engines floor, exactly — never resolved past
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Windows runners carry an elevated token, which postgres.exe hard-refuses — the
      # embedded server cannot start there (initdb self-restricts its token and
      # succeeds, the server binary does not; the first matrix run proved it). The
      # runner image preinstalls PostgreSQL as a proper service under a non-admin
      # account: start it and hand the suite its URL through the globalSetup's
      # documented external-server seam. Every other OS runs the embedded server.
      - name: start the preinstalled PostgreSQL (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svc = Get-Service -Name postgresql* | Select-Object -First 1
          if ($null -eq $svc) { Write-Error 'no preinstalled postgresql service found on the runner image'; exit 1 }
          Set-Service -InputObject $svc -StartupType Manual
          Start-Service -InputObject $svc
          Write-Host "started service: $($svc.Name)"
          & "$env:PGBIN\pg_isready" -h 127.0.0.1 -p 5432
          "VIDIMERA_PG_URL=postgresql://postgres:root@127.0.0.1:5432/postgres" >> $env:GITHUB_ENV
      # The test gate reads vitest's own JSON report rather than trusting the step's exit code —
      # a code that has to survive vitest, pnpm and the runner's shell in turn, and was silently 0
      # for every failed run until the CI test-gate repair (scripts/ci-assert-tests.mjs).
      - run: pnpm test:ci
      - run: node scripts/ci-assert-tests.mjs .vitest-results.json
      - run: pnpm build
      - run: pnpm smoke
