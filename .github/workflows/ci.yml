# Two-tier CI (phase-3 ruling, docs/analysis/2026-08-19-phase-3-ci.md): the
# platform-independent gates run once on Linux; tests + build + the packed-tarball smoke
# test run on a small deliberate matrix — the exact declared engines floor (22.16.0, which
# a bare `node-version: 22` never tests), current Node, and all three OSes (this repository
# is developed on Windows, and node:sqlite plus npm pack are the platform-sensitive parts).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm contract-scan
      - run: pnpm api-sync
      - run: pnpm docs-index-sync
      - run: pnpm lint:strict
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.16.0 # the declared engines floor, exactly — never resolved past
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Windows runners carry an elevated token, which postgres.exe hard-refuses — the
      # embedded server cannot start there (initdb self-restricts its token and
      # succeeds, the server binary does not; the first matrix run proved it). The
      # runner image preinstalls PostgreSQL as a proper service under a non-admin
      # account: start it and hand the suite its URL through the globalSetup's
      # documented external-server seam. Every other OS runs the embedded server.
      - name: start the preinstalled PostgreSQL (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svc = Get-Service -Name postgresql* | Select-Object -First 1
          if ($null -eq $svc) { Write-Error 'no preinstalled postgresql service found on the runner image'; exit 1 }
          Set-Service -InputObject $svc -StartupType Manual
          Start-Service -InputObject $svc
          Write-Host "started service: $($svc.Name)"
          & "$env:PGBIN\pg_isready" -h 127.0.0.1 -p 5432
          "VIDIMERA_PG_URL=postgresql://postgres:root@127.0.0.1:5432/postgres" >> $env:GITHUB_ENV
      - run: pnpm test
      # CANARY (never to be merged): where does a vitest failure's exit code go on Windows?
      - name: CANARY diagnostics (pwsh)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Write-Host "node $(node -v); pnpm $(pnpm -v); pwsh $($PSVersionTable.PSVersion); PATHEXT=$env:PATHEXT"
          Write-Host "pnpm resolves to: $((Get-Command pnpm).Source)"
          pnpm test
          Write-Host "CANARY[pwsh] pnpm test (both projects) => LASTEXITCODE=$LASTEXITCODE"
          pnpm test -- --project record
          Write-Host "CANARY[pwsh] pnpm test -- --project record => LASTEXITCODE=$LASTEXITCODE"
          node node_modules/vitest/vitest.mjs run --project record
          Write-Host "CANARY[pwsh] node vitest.mjs run --project record => LASTEXITCODE=$LASTEXITCODE"
          pnpm exec vitest run --project record
          Write-Host "CANARY[pwsh] pnpm exec vitest run --project record => LASTEXITCODE=$LASTEXITCODE"
          exit 0
      - name: CANARY diagnostics (bash)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: bash
        run: |
          pnpm test -- --project record; echo "CANARY[bash] pnpm test -- --project record => exit=$?"
          node node_modules/vitest/vitest.mjs run --project record; echo "CANARY[bash] node vitest.mjs run --project record => exit=$?"
          exit 0
      - run: pnpm build
      - run: pnpm smoke
