# Two-tier CI (phase-3 ruling, docs/analysis/2026-08-19-phase-3-ci.md): the
# platform-independent gates run once on Linux; tests + build + the packed-tarball smoke
# test run on a small deliberate matrix — the exact declared engines floor (22.16.0, which
# a bare `node-version: 22` never tests), current Node, and all three OSes (this repository
# is developed on Windows, and node:sqlite plus npm pack are the platform-sensitive parts).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm contract-scan
      - run: pnpm api-sync
      - run: pnpm lint:strict
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.16.0 # the declared engines floor, exactly — never resolved past
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
